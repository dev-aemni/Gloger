<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gloger Auth Portal</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { --bg: #0d1117; --card-bg: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; --success: #238636; --error: #da3633; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; width: 90%; max-width: 400px; text-align: center; }
    #status { font-size: 0.9rem; margin-top: 1rem; color: var(--accent); }
    .status-error { color: var(--error) !important; }
    .status-success { color: var(--success) !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="margin-top:0;">Gloger Login</h2>
    <p style="font-size: 0.85rem; color: #8b949e;">Authenticate your CLI agent session</p>
    
    <div id="signin-container" style="display:flex; justify-content:center;"></div>
    <div id="status">Loading config...</div>
  </div>

  <script>
    const RENDER_URL = "https://gloger.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    const callbackUrl = urlParams.get('callback');

    async function init() {
      try {
        const res = await fetch(`${RENDER_URL}/api/config`);
        const { clientId } = await res.json();

        google.accounts.id.initialize({
          client_id: clientId,
          callback: handleLogin
        });

        google.accounts.id.renderButton(
          document.getElementById("signin-container"),
          { theme: "filled_dark", size: "large" }
        );

        document.getElementById("status").innerText = "";
      } catch (err) {
        document.getElementById("status").innerText = "Failed to load auth server.";
      }
    }

    async function handleLogin(response) {
      const statusEl = document.getElementById("status");
      statusEl.innerText = "Authenticating with database...";

      try {
        const res = await fetch(`${RENDER_URL}/api/auth/google`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: response.credential })
        });

        const data = await res.json();

        if (res.ok) {
          statusEl.className = "status-success";

          // If CLI login loopback is active, notify local CLI listener
          if (callbackUrl) {
            statusEl.innerText = "Sending credentials to CLI...";
            await fetch(`${callbackUrl}?apiKey=${data.user.apiKey}&email=${data.user.email}`);
            document.querySelector(".card").innerHTML = `
              <h2 style="color:var(--success)">Authentication Successful!</h2>
              <p>Your CLI agent is now logged in. You can close this tab safely.</p>
            `;
          } else {
            statusEl.innerText = `Logged in as ${data.user.email}. Tokens: ${data.tokensRemaining.toLocaleString()}`;
          }
        } else {
          statusEl.className = "status-error";
          statusEl.innerText = data.message;
        }
      } catch (err) {
        statusEl.className = "status-error";
        statusEl.innerText = "Backend error.";
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
